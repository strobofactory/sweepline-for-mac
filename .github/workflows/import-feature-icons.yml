name: Import Sweepline feature icons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-feature-icons.yml

permissions:
  contents: write

jobs:
  import-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Download and optimize icons
        run: |
          mkdir -p assets/feature-icons
          curl --fail --location 'https://pikaso.cdnpk.net/private/production/5493290013/3612767680.png?token=exp=1790035200~hmac=a52a0eb8b8de077bbcf08d5e4fe3a2efccb2bf05fcb3d213fe59311222ac0547' --output /tmp/01-smart-scan.png
          cwebp -quiet -q 88 -resize 512 512 /tmp/01-smart-scan.png -o assets/feature-icons/01-smart-scan.webp
          curl --fail --location 'https://pikaso.cdnpk.net/private/production/5493290224/3612767796.png?token=exp=1790035200~hmac=5cc966de87ec18aedb0ae59192117ed9f5bb9c3f09e1784f3fbb8da0c88b72fd' --output /tmp/02-cleanup.png
          cwebp -quiet -q 88 -resize 512 512 /tmp/02-cleanup.png -o assets/feature-icons/02-cleanup.webp
          curl --fail --location 'https://pikaso.cdnpk.net/private/production/5493290411/3612767875.png?token=exp=1790035200~hmac=4fad539bc2f1c9d82e273a074eae24726490daf42cc185983da47ad2c296be39' --output /tmp/03-duplicates.png
          cwebp -quiet -q 88 -resize 512 512 /tmp/03-duplicates.png -o assets/feature-icons/03-duplicates.webp
          curl --fail --location 'https://pikaso.cdnpk.net/private/production/5493290600/3612767979.png?token=exp=1790035200~hmac=f8cff5eb2a608ac41cb2d35d9ab42809a1439fff75d2d5a0e3d4f08a858021a7' --output /tmp/04-large-files.png
          cwebp -quiet -q 88 -resize 512 512 /tmp/04-large-files.png -o assets/feature-icons/04-large-files.webp
          curl --fail --location 'https://pikaso.cdnpk.net/private/production/5493290822/3612768089.png?token=exp=1790035200~hmac=b86c123a0a7ac37ea78414673ba1ca16e3e931c38d1198174e3bd4f4f4fc0477' --output /tmp/05-uninstaller.png
          cwebp -quiet -q 88 -resize 512 512 /tmp/05-uninstaller.png -o assets/feature-icons/05-uninstaller.webp
          curl --fail --location 'https://pikaso.cdnpk.net/private/production/5493291002/3612768184.png?token=exp=1790035200~hmac=8d73484aa9582ae721f73a40da58b55ab304d695b0df9702ef1c43715c89495e' --output /tmp/06-startup-items.png
          cwebp -quiet -q 88 -resize 512 512 /tmp/06-startup-items.png -o assets/feature-icons/06-startup-items.webp
          curl --fail --location 'https://pikaso.cdnpk.net/private/production/5493291170/3612768304.png?token=exp=1790035200~hmac=bca96ec3998fd0508a9a0ca7b442ee27b6eef683c90a43aa1504db1ef1bdbadc' --output /tmp/07-status.png
          cwebp -quiet -q 88 -resize 512 512 /tmp/07-status.png -o assets/feature-icons/07-status.webp

      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/feature-icons
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Sweepline feature icons"
          git push
